# Start everything with:  docker compose up --build
# Then open http://localhost:3000
services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data   # keeps the data when the container restarts
    healthcheck:                           # the backend waits until the database is really ready
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 15

  # Python API
  backend:
    build: ./backend
    env_file: .env                         # SECRET_KEY, ENCRYPTION_KEYS, ...
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs           # log files show up in backend/logs on your machine
    ports:
      - "8000:8000"                        # API docs: http://localhost:8000/api/docs

  # React app served by nginx
  frontend:
    build:
      context: ./frontend
      args:
        API_KEY: ${API_KEY}                # same key the backend checks
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
